services:
  node:
    container_name: synest_client
    image: node:lts
    restart: unless-stopped
    volumes:
      - ./:/var/www/html/app
    working_dir: /var/www/html/app/
    command: yarn dev
    ports:
      - "8100:8100"
    networks:
      - synest

networks:
  synest:
    external: true
